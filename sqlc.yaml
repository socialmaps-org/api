version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/model/queries.sql"
    schema: "internal/database/"
    gen:
      go:
        sql_package: "pgx/v5"
        out: "internal/model"
        # This is to avoid generating `*Params` structs for query args, which
        # I find error-prone as it's fairly easy to forget initialising some
        # struct fields and inadvertently use zero-values for them instead. In
        # contrast, one cannot forget to provide function arguments.
        query_parameter_limit: 1000
        emit_pointers_for_null_types: true

        rename:
          socialmaps_computed_place: ComputedPlace
          socialmaps_optional_computed_place: OptionalComputedPlace
          socialmaps_user: User
          socialmaps_place: Place
          socialmaps_review: Review
          socialmaps_review_decision: ReviewDecision
          osm2pgsql_element: Element
        overrides:
          - db_type: "pg_catalog.timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - column: "osm2pgsql.element.tags"
            go_type:
              type: "map[string]string"
          # https://github.com/sqlc-dev/sqlc/issues/3028
          - column: "socialmaps.computed_place.avg_rating"
            go_type:
              type: "float64"
              pointer: true
