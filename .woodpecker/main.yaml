when:
  branch: main
  event: [push, pull_request, manual]

steps:
  - name: check-scripts
    image: koalaman/shellcheck-alpine:latest
    commands:
      - ./scripts/check-scripts.sh

  - name: check-format
    image: golang:1.25.4-trixie
    commands:
      - ./scripts/check-format.sh
    depends_on: [check-scripts]

  - name: check-deadcode
    image: golang:1.25.4-trixie
    commands:
      - go install golang.org/x/tools/cmd/deadcode@latest
      - ./scripts/check-deadcode.sh
    depends_on: [check-scripts]

  - name: lint
    image: golang:1.25.4-trixie
    commands:
      - go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
      - ./scripts/lint.sh
    depends_on: [check-scripts]

  - name: lint-sql
    image: sqlfluff/sqlfluff:3.5.0
    commands:
      - ./scripts/lint-sql.sh
    depends_on: [check-scripts]

  - name: test
    image: golang:1.25.4-trixie
    commands:
      - make
      - ./scripts/test.sh
    depends_on: [check-scripts, check-format, check-deadcode, lint, lint-sql]

  - name: publish-dryrun
    image: 'woodpeckerci/plugin-docker-buildx:6.0.3'
    settings:
      platforms: linux/amd64
      dry-run: true
    depends_on: [test]
    when:
      - event: [pull_request, manual]

  - name: publish
    image: 'woodpeckerci/plugin-docker-buildx:6.0.3'
    settings:
      repo: codeberg.org/socialmaps/api
      platforms: linux/amd64
      auto_tag: true
      logins:
        - registry: https://codeberg.org
          username:
            from_secret: cb_username
          password:
            from_secret: cb_password
    depends_on: [test]
    when:
      - event: [push, manual]
        branch: main
